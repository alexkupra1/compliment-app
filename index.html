<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Комплиментик 💐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .login-section { text-align: center; margin-bottom: 30px; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
            margin: 10px 0;
        }
        button:hover { transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin: 10px 0;
        }
        .result {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 18px;
            line-height: 1.6;
            display: none;
        }
        .hidden { display: none; }
        .loading { text-align: center; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Комплиментик 💐</h1>
        <p class="subtitle">ИИ-генератор тёплых слов для особенных людей</p>

        <div id="loginSection" class="login-section">
            <button onclick="login()">Войти через Pollinations 🔑</button>
            <p style="color: #999; font-size: 14px; margin-top: 10px;">
                Вход безопасен. Вы тратите свою пыльцу (копейки за запрос).
            </p>
        </div>

        <div id="appSection" class="hidden">
            <input type="text" id="nameInput" placeholder="Как её зовут? (необязательно)">
            
            <select id="moodSelect">
                <option value="романтичное">💕 Романтичное</option>
                <option value="с юмором">😄 С юмором</option>
                <option value="поддерживающее">🤗 Поддерживающее</option>
            </select>

            <button onclick="generateCompliment()">✨ Сделать комплимент</button>

            <div id="result" class="result">
                <p id="complimentText"></p>
                <button onclick="copyCompliment()" style="margin-top: 15px;">📋 Скопировать</button>
            </div>

            <div id="loading" class="loading hidden">
                <p>Придумываю...</p>
            </div>

            <button onclick="logout()" style="background: #ccc; color: #333; margin-top: 20px;">Выйти</button>
        </div>
    </div>

    <script>
        const APP_KEY = 'pk_CtBw0yFg1Z9oI4Bn'; // <-- ВАЖНО: замени на свой pk_...
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        let accessToken = null;

        // Проверяем, есть ли токен в URL после возврата с авторизации
        window.onload = function() {
            const hash = window.location.hash;
            if (hash.includes('access_token')) {
                const params = new URLSearchParams(hash.substring(1));
                accessToken = params.get('access_token');
                showApp();
            }
        };

        function login() {
            const state = Math.random().toString(36).substring(7);
            const authUrl = `https://enter.pollinations.ai/authorize?client_id=${APP_KEY}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=usage&state=${state}`;
            window.location.href = authUrl;
        }

        function showApp() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
        }

        function logout() {
            accessToken = null;
            window.location.hash = '';
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('appSection').classList.add('hidden');
        }

        async function generateCompliment() {
            if (!accessToken) {
                alert('Сначала войди через Pollinations!');
                return;
            }

            const name = document.getElementById('nameInput').value || 'она';
            const mood = document.getElementById('moodSelect').value;

            document.getElementById('result').style.display = 'none';
            document.getElementById('loading').classList.remove('hidden');

            const prompt = `Придумай один короткий тёплый комплимент для ${name} в настроении "${mood}". На русском языке, 1-2 предложения, искренне и красиво. Только текст комплимента, без пояснений.`;

            try {
                const response = await fetch('https://gen.pollinations.ai/text/' + encodeURIComponent(prompt), {
                    headers: {
                        'Authorization': 'Bearer ' + accessToken
                    }
                });

                const text = await response.text();
                
                document.getElementById('complimentText').textContent = text;
                document.getElementById('result').style.display = 'block';
                document.getElementById('loading').classList.add('hidden');

            } catch (error) {
                alert('Ошибка: ' + error.message);
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function copyCompliment() {
            const text = document.getElementById('complimentText').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('Скопировано! 📋');
            });
        }
    </script>
</body>
</html>
