<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Комплиментик 💐 — генератор комплиментов</title>
<style>
  :root { --pink:#ff6b9d; }
  * { box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:linear-gradient(135deg,#ffeef5,#fff8e7); padding:16px; }
  .card { background:#fff; border-radius:24px; padding:32px; max-width:480px; width:100%;
          box-shadow:0 12px 40px rgba(255,107,157,.18); text-align:center; }
  h1 { margin:0 0 4px; font-size:32px; }
  .sub { color:#888; margin:0 0 24px; }
  button { cursor:pointer; border:none; border-radius:14px; font-size:16px; padding:12px 22px; }
  #loginBtn, #genBtn { background:var(--pink); color:#fff; font-weight:600; width:100%; }
  #loginBtn:hover, #genBtn:hover { filter:brightness(1.07); }
  .hint { color:#aaa; font-size:13px; margin-top:12px; }
  input { width:100%; padding:12px 14px; border:2px solid #ffd7e4; border-radius:14px;
          font-size:16px; margin-bottom:12px; outline:none; }
  input:focus { border-color:var(--pink); }
  .moods { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; justify-content:center; }
  .mood { background:#fff0f5; color:#c2477a; border:2px solid transparent; font-size:14px; padding:8px 12px; }
  .mood.selected { border-color:var(--pink); background:#ffe3ec; font-weight:600; }
  .result { background:#fff8ec; border-radius:16px; padding:18px; margin-top:18px; }
  #complimentText { font-size:18px; line-height:1.5; margin:0 0 12px; white-space:pre-wrap; }
  .result button { background:#ffd7e4; color:#a12d5c; font-size:14px; padding:8px 14px; margin:0 4px; }
  .small { background:none; color:#bbb; font-size:13px; margin-top:18px; text-decoration:underline; }
  .error { color:#c0392b; background:#fdecea; border-radius:12px; padding:10px; margin-top:12px; font-size:14px; }
</style>
</head>
<body>
<div class="card">
  <h1>💐 Комплиментик</h1>
  <p class="sub">Нейросеть подберёт тёплые слова для неё</p>

  <div id="loginBox">
    <button id="loginBtn">🔑 Войти через Pollinations</button>
    <p class="hint">Один комплимент стоит меньше тысячной пыльцы Pollinations.</p>
  </div>

  <div id="appBox" hidden>
    <input id="nameInput" placeholder="Как её зовут? (необязательно)" maxlength="30">
    <div class="moods">
      <button class="mood selected" data-mood="romantic">💖 Романтично</button>
      <button class="mood" data-mood="funny">😄 С юмором</button>
      <button class="mood" data-mood="support">🤗 С поддержкой</button>
    </div>
    <button id="genBtn">✨ Сделать комплимент</button>
    <div id="result" class="result" hidden>
      <p id="complimentText"></p>
      <button id="copyBtn">📋 Скопировать</button>
      <button id="againBtn">🔄 Ещё</button>
    </div>
    <div id="errorBox" class="error" hidden></div>
    <button id="logoutBtn" class="small">выйти</button>
    <p style="margin-top:22px;">
      <a href="https://pollinations.ai/?ref=badge" target="_blank">
        <img
          src="https://raw.githubusercontent.com/pollinations/pollinations/main/packages/ui/src/brand/badge-made-with.svg"
          alt="Made with pollinations.ai"
          style="height:28px;border-radius:6px;"
        >
      </a>
    </p>
  </div>
</div>

<script>
const CLIENT_ID = "pk_CtBw0yFg1Z9oI4Bn";
const REDIRECT_URI = "https://alexkupra1.github.io/compliment-app/";
const MODEL = "openai/gpt-5.4-nano";

const $ = id => document.getElementById(id);

function randomString(len){
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return Array.from(arr, b => b.toString(36)).join("").slice(0, len);
}
async function sha256base64url(text){
  const data = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", data);
  let bin = "";
  new Uint8Array(hash).forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

$("loginBtn").onclick = async () => {
  const verifier = randomString(64);
  const state = randomString(16);
  sessionStorage.setItem("pkce_verifier", verifier);
  sessionStorage.setItem("oauth_state", state);
  const challenge = await sha256base64url(verifier);
  location.href = "https://enter.pollinations.ai/authorize"
    + "?response_type=code"
    + "&client_id=" + encodeURIComponent(CLIENT_ID)
    + "&redirect_uri=" + encodeURIComponent(REDIRECT_URI)
    + "&state=" + encodeURIComponent(state)
    + "&budget=1"
    + "&code_challenge=" + encodeURIComponent(challenge)
    + "&code_challenge_method=S256";
};

(async () => {
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  if (code){
    const savedState = sessionStorage.getItem("oauth_state");
    const state = params.get("state");
    history.replaceState(null, "", REDIRECT_URI);
    if (state && savedState && state !== savedState){
      showError("Ошибка проверки state. Попробуй войти ещё раз.");
      return;
    }
    try {
      const res = await fetch("https://enter.pollinations.ai/api/oauth/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          grant_type: "authorization_code",
          code: code,
          client_id: CLIENT_ID,
          redirect_uri: REDIRECT_URI,
          code_verifier: sessionStorage.getItem("pkce_verifier")
        })
      });
      const data = await res.json();
      if (data.access_token){
        sessionStorage.setItem("access_token", data.access_token);
      } else {
        showError("Не удалось получить токен: " + (data.error_description || data.error || "unknown"));
      }
    } catch(e){ showError("Ошибка сети: " + e.message); }
  }
  if (sessionStorage.getItem("access_token")){
    $("loginBox").hidden = true;
    $("appBox").hidden = false;
  }
})();

let mood = "romantic";
document.querySelectorAll(".mood").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".mood").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    mood = btn.dataset.mood;
  };
});

const MOODS = {
  romantic: "романтичный и нежный, как строчка из любовной поэзии",
  funny: "с лёгким добрым юмором, чтобы она улыбнулась",
  support: "тёплый и поддерживающий, как объятие словами"
};

$("genBtn").onclick = async () => {
  const token = sessionStorage.getItem("access_token");
  if (!token) return;
  const name = $("nameInput").value.trim();
  $("genBtn").disabled = true;
  $("genBtn").textContent = "✨ Думаем...";
  hideError();
  try {
    const res = await fetch("https://gen.pollinations.ai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: MODEL,
        messages: [
          { role: "system", content: "Ты — талантливый автор комплиментов на русском языке. Придумай РОВНО ОДИН комплимент девушке: 1-2 предложения, искренне, без пошлости, без кавычек и без пояснений." },
          { role: "user", content: "Настроение комплимента: " + MOODS[mood] + ". " + (name ? "Имя девушки: " + name + ". " : "") + "Не повторяй предыдущие комплименты." }
        ]
      })
    });
    const data = await res.json();
    if (data.choices && data.choices[0]){
      $("complimentText").textContent = data.choices[0].message.content.trim();
      $("result").hidden = false;
    } else {
      showError("Ответ сервера: " + JSON.stringify(data).slice(0, 200));
    }
  } catch(e){ showError("Ошибка сети: " + e.message); }
  $("genBtn").disabled = false;
  $("genBtn").textContent = "✨ Сделать комплимент";
};

$("copyBtn").onclick = () => {
  navigator.clipboard.writeText($("complimentText").textContent);
  $("copyBtn").textContent = "✅ Скопировано!";
  setTimeout(() => $("copyBtn").textContent = "📋 Скопировать", 1500);
};
$("againBtn").onclick = () => $("genBtn").click();

$("logoutBtn").onclick = () => {
  sessionStorage.removeItem("access_token");
  location.reload();
};

function showError(t){ $("errorBox").textContent = t; $("errorBox").hidden = false; }
function hideError(){ $("errorBox").hidden = true; }
</script>
</body>
</html>
